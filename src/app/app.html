<main class="py-5">
  <div class="container-sm">

    <div class="text-center">

      <h1 class="fw-bold mb-4">🌟 Quote of the Day 🌟</h1>

      <!-- Loading Spinner -->
      <div *ngIf="isLoading()" class="my-4 d-flex justify-content-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Quote Card -->
      <div
        *ngIf="quote()"
        class="card shadow-lg border-0 mx-auto mb-4"
        style="max-width: 650px; border-radius: 1rem;"
      >
        <div class="card-body p-4">
          <blockquote class="blockquote mb-0">
            <p class="fs-4 lh-base mb-3">
              “{{ quote()?.content }}”
            </p>
            <footer class="blockquote-footer">
              {{ quote()?.author }}
            </footer>
          </blockquote>
        </div>
      </div>

      <!-- Buttons -->
      <div class="d-flex justify-content-center gap-3 mt-3">
        <button class="btn btn-primary px-4" (click)="getQuote()">
          🔄 New Quote
        </button>

        <a
          *ngIf="quote()"
          class="btn btn-outline-secondary px-4"
          [href]="'https://twitter.com/intent/tweet?text=' + safeEncode(quote()?.content + ' — ' + quote()?.author)"
          target="_blank"
          rel="noopener noreferrer"
        >
          🐦 Tweet This
        </a>
      </div>

    </div>

  </div>
</main>
